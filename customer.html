<style>
:root{--bg:#10162A;--card:rgba(255,255,255,.07);--line:rgba(241,233,216,.2);--ink:#F1E9D8;--mute:#A9A99F;--gold:#E8A317;--on-gold:#10162A;--field:rgba(255,255,255,.07);--glow1:rgba(232,163,23,.2);--glow2:rgba(194,65,12,.18);--cs:dark;--ok:#22C55E;--bad:#EF4444;--warn:#FBBF24;
--serif:"Cormorant Garamond",Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:root[data-theme="red"]{--bg:#0A0608;--card:rgba(255,255,255,.055);--line:rgba(255,190,198,.2);--ink:#F8EEEE;--mute:#BDA7AB;--gold:#E23B52;--on-gold:#fff;--field:rgba(255,255,255,.06);--glow1:rgba(200,20,60,.3);--glow2:rgba(120,8,20,.32);--cs:dark}
:root[data-theme="light"]{--bg:#F5EFE2;--card:rgba(255,255,255,.72);--line:rgba(27,32,56,.16);--ink:#1B2038;--mute:#5E5F63;--gold:#B2740A;--on-gold:#fff;--field:rgba(255,255,255,.85);--glow1:rgba(232,163,23,.25);--glow2:rgba(194,65,12,.14);--cs:light}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(60% 40% at 0% 0%,var(--glow1),transparent 70%),radial-gradient(50% 40% at 100% 30%,var(--glow2),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font:400 16px/1.55 var(--sans);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0}h1{font-size:34px}h2{font-size:26px;margin-bottom:6px}
.wrap{max-width:680px;margin:0 auto;padding:18px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:14px 0;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 14px 40px -20px #000;animation:rise .7s cubic-bezier(.22,1,.36,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mute);margin-bottom:10px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;color-scheme:var(--cs)}
input:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
button,.btn{font:600 15px var(--sans);border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:11px 20px;cursor:pointer;text-decoration:none;display:inline-block;transition:transform .3s,border-color .3s,box-shadow .3s}
button:hover,.btn:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 10px 26px -10px var(--gold)}
.pri{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
:root[data-theme="red"] .pri,:root[data-theme="red"] .tabs button[aria-pressed="true"]{background:linear-gradient(135deg,#E23B52,#7F0F22);border-color:transparent;color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stat{display:grid;gap:8px;grid-template-columns:repeat(2,1fr);margin:12px 0}.stat div{padding:10px 14px;border:1px solid var(--line);border-radius:16px}.stat b{display:block;font:600 24px var(--serif);color:var(--gold)}
.mute{color:var(--mute);font-size:14px}.badge{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line)}
.b-Confirmed{color:var(--ok);border-color:rgba(34,197,94,.6)}.b-Pending{color:var(--warn);border-color:rgba(251,191,36,.6)}.b-Rejected,.b-Cancelled{color:var(--bad);border-color:rgba(239,68,68,.6)}
.tabs{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.tabs button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.qr{display:block;margin:12px auto;width:min(280px,100%);padding:12px;border-radius:22px;background:#fff;box-shadow:0 0 40px -8px var(--gold)}
.upi{font:600 18px var(--sans);word-break:break-all}
.stages{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:12px 0}
.stg{text-align:left;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}.stg b{font:600 17px var(--serif)}.stg span{font-size:13px;color:var(--mute)}.stg strong{font:600 22px var(--sans);color:var(--gold)}
.stg[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 18%,transparent);box-shadow:0 0 0 2px var(--gold)}.stg[disabled]{opacity:.55;cursor:default;transform:none;box-shadow:none}
.amt{font:600 38px var(--serif);color:var(--gold);margin:6px 0}
.notice{padding:12px 14px;border-radius:16px;margin:10px 0;font-size:14px}.n-bad{background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.5)}.n-warn{background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.5)}
.pm{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.pm div{padding:12px;border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;gap:6px}.tag{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);width:fit-content}
.stars{display:flex;gap:6px;position:relative;margin:8px 0}.stars button{background:none;border:0;padding:4px;color:var(--mute);font-size:36px;line-height:1;cursor:pointer;transition:transform .25s,color .25s}
.stars button:hover{transform:translateY(-4px) scale(1.12);color:var(--gold)}.stars button.on{color:var(--gold)}
.spark{position:absolute;width:7px;height:7px;border-radius:50%;pointer-events:none;box-shadow:0 0 10px var(--gold)}
#msg,.msg{min-height:1.4em;color:var(--gold);margin-top:8px}.pre{white-space:pre-line}
a{color:var(--gold)}[hidden]{display:none!important}
.topnav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 18px;margin:0 0 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.topnav .brand{display:flex;align-items:center;gap:10px;font:600 22px var(--serif);color:var(--ink);text-decoration:none}.topnav .brand img{width:38px;height:38px}
.topnav div{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:14px}.topnav div a{color:var(--mute);text-decoration:none;padding:4px 2px;transition:color .3s,transform .3s}.topnav div a:hover,.topnav .act{color:var(--gold)}.topnav div a:hover{transform:translateY(-2px)}
.split3{display:grid;gap:8px;grid-template-columns:repeat(3,1fr);margin-top:10px}.split3 div{padding:10px;border:1px solid var(--line);border-radius:14px;text-align:center}.split3 b{display:block;font:600 20px var(--serif);color:var(--gold)}
.ov{position:fixed;inset:0;z-index:50;background:rgba(5,3,4,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:18px 14px 110px;animation:rise .4s cubic-bezier(.22,1,.36,1)}
:root[data-theme="light"] .ov{background:rgba(245,239,226,.9)}
.ov .box{width:min(460px,100%);background:var(--bg);border:1px solid var(--line);border-radius:26px;padding:20px;margin:auto;box-shadow:0 30px 80px -20px #000;text-align:center}
.warnbox{padding:14px;border-radius:18px;border:1px solid rgba(251,191,36,.6);background:rgba(251,191,36,.12);text-align:left;margin:12px 0}
.cont{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(14px + env(safe-area-inset-bottom));z-index:60;padding:14px 26px;font-size:16px;box-shadow:0 14px 40px -10px var(--gold)}
.ring{position:relative;width:132px;height:132px;margin:8px auto}.ring svg{transform:rotate(-90deg)}.ring .t{position:absolute;inset:0;display:grid;place-items:center;font:700 26px var(--sans)}
.ring circle{fill:none;stroke-width:9}.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.wait{display:flex;align-items:center;gap:10px;justify-content:center;margin:8px 0;color:var(--gold);font-weight:600}.wait i{width:10px;height:10px;border-radius:50%;background:var(--gold);animation:pulse 1.2s infinite}.wait i:nth-child(2){animation-delay:.2s}.wait i:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{transform:scale(.6);opacity:.4}50%{transform:scale(1.2);opacity:1}}
.big{font:600 30px var(--serif)}.check{width:96px;height:96px;margin:6px auto}.check circle{fill:none;stroke:var(--ok);stroke-width:5;stroke-dasharray:290;stroke-dashoffset:290;animation:dr .7s .1s forwards}.check path{fill:none;stroke:var(--ok);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:dr .5s .7s forwards}@keyframes dr{to{stroke-dashoffset:0}}
.confetti{position:fixed;width:9px;height:14px;top:-20px;z-index:70;pointer-events:none;opacity:.95}
.done-card{text-align:center}.done-card .note{font:italic 500 21px/1.5 var(--serif);margin:12px 0;color:var(--ink)}
.th{display:flex;gap:6px;align-items:center}.th select,.th button{font:500 13px var(--sans);padding:6px 10px;border-radius:999px;background:var(--field);color:var(--ink);border:1px solid var(--line);width:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
