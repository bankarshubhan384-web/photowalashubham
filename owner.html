:root{--bg:#10162A;--card:rgba(255,255,255,.07);--line:rgba(241,233,216,.18);--ink:#F1E9D8;--mute:#A9A99F;--gold:#E8A317;--ok:#22C55E;--bad:#EF4444;--warn:#FBBF24;

h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0}
.wrap{max-width:900px;margin:0 auto;padding:16px}

button:hover,.btn:hover{transform:translateY(-2px);border-color:var(--gold)}
.pri{background:var(--gold);color:#10162A;border-color:var(--gold)}.ok{background:var(--ok);color:#052e14;border-color:var(--ok)}.no{color:#ffb4b4;border-color:rgba(239,68,68,.6)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tabs button[aria-pressed="true"]{background:var(--gold);color:#10162A;border-color:var(--gold)}
.badge{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.b-Confirmed{color:var(--ok);border-color:rgba(34,197,94,.6)}.b-Pending{color:var(--warn);border-color:rgba(251,191,36,.6)}.b-Cancelled,.b-Rejected{color:var(--bad);border-color:rgba(239,68,68,.6)}

.pay{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.stat{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));margin:10px 0}.stat div{padding:8px 12px;border:1px solid var(--line);border-radius:14px}.stat b{display:block;font:600 20px var(--serif);color:var(--gold)}

a{color:var(--gold)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.card{animation:rise .6s cubic-bezier(.22,1,.36,1) backwards}
