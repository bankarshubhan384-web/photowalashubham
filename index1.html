<style>
:root{--bg:#10162A;--bg2:#171F3A;--ink:#F1E9D8;--mute:#A9A99F;--gold:#E8A317;--line:rgba(241,233,216,.18);
--serif:"Cormorant Garamond",Georgia,serif;--sans:"Manrope",system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]):not([data-theme="red"]){--bg:#F5EFE2;--bg2:#EAE1CD;--ink:#1B2038;--mute:#5E5F63;--gold:#B2740A;--line:rgba(27,32,56,.2)}}
:root[data-theme="light"]{--bg:#F5EFE2;--bg2:#EAE1CD;--ink:#1B2038;--mute:#5E5F63;--gold:#B2740A;--line:rgba(27,32,56,.2)}
:root[data-theme="dark"]{--bg:#10162A;--bg2:#171F3A;--ink:#F1E9D8;--mute:#A9A99F;--gold:#E8A317;--line:rgba(241,233,216,.18)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--sans)}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
nav{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px clamp(20px,5vw,64px);border-bottom:1px solid var(--line)}
nav b{font:600 22px var(--serif);letter-spacing:.02em}
nav div{display:flex;gap:22px;font-size:14px}
nav a{text-decoration:none;color:var(--mute)}nav a:hover{color:var(--gold)}
.hero{padding:clamp(40px,8vw,96px) clamp(20px,5vw,64px) 40px}
.hero h1{font:500 clamp(48px,10vw,128px)/.95 var(--serif);margin:0 0 24px;max-width:12ch}
.hero p{max-width:52ch;color:var(--mute);margin:0 0 28px;font-size:18px}
.btn{display:inline-block;padding:12px 26px;background:var(--gold);color:#10162A;font-weight:600;text-decoration:none;border-radius:2px}
.frame{margin:48px 0 0;aspect-ratio:2.39/1;position:relative;overflow:hidden;border-radius:2px;
background:radial-gradient(ellipse at 70% 80%,#E8A317 0,#C2410C 22%,transparent 55%),linear-gradient(120deg,#0B1022,#26305A 60%,#6B3A2A)}
.frame span{position:absolute;left:20px;bottom:14px;font-size:13px;color:#F1E9D8;opacity:.85}
section{padding:56px clamp(20px,5vw,64px)}
h2{font:500 clamp(32px,5vw,56px)/1.1 var(--serif);margin:0 0 24px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.tabs button{background:none;border:1px solid var(--line);color:var(--ink);padding:8px 18px;font:500 14px var(--sans);border-radius:2px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--gold);color:#10162A;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:28px}
.card{text-decoration:none;display:block}
.thumb{aspect-ratio:2.39/1;border-radius:2px;position:relative;display:grid;place-items:center;transition:transform .25s}
.card:hover .thumb{transform:scale(1.02)}
.play{width:52px;height:52px;border:2px solid #F1E9D8;border-radius:50%;display:grid;place-items:center}
.play:after{content:"";border-left:14px solid #F1E9D8;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.card h3{font:600 24px var(--serif);margin:12px 0 0}
.card p{margin:0;color:var(--mute);font-size:14px}
.about{background:var(--bg2);display:grid;gap:32px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.about p{color:var(--mute);margin:0 0 14px;max-width:60ch}
.about ul{list-style:none;padding:0;margin:0}
.about li{padding:12px 0;border-bottom:1px solid var(--line)}
.contact a.big{font:500 clamp(24px,4vw,44px) var(--serif);color:var(--gold);text-decoration:none;word-break:break-all}
.links{display:flex;gap:24px;flex-wrap:wrap;margin-top:20px}
footer{padding:24px clamp(20px,5vw,64px);color:var(--mute);font-size:13px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.portrait{margin:0;position:relative;max-width:360px;border:1px solid var(--gold);padding:8px;border-radius:2px}.portrait img{display:block;width:100%;height:auto;filter:none}.portrait:after{content:"";position:absolute;left:8px;right:8px;bottom:8px;height:22%;background:linear-gradient(transparent,rgba(16,22,42,.6))}.portrait figcaption{position:absolute;left:22px;bottom:20px;z-index:1;color:#F1E9D8;font:600 22px var(--serif)}.portrait figcaption small{display:block;font:400 13px var(--sans);color:#E8A317}
dialog#player{border:0;padding:0;background:#000;width:min(960px,94vw);border-radius:2px;color:#F1E9D8}dialog#player::backdrop{background:rgba(5,8,18,.85)}
#player .bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:14px;background:#10162A}
#player .bar a{color:#E8A317}#player .bar button{background:none;border:1px solid #F1E9D8;color:#F1E9D8;padding:6px 14px;cursor:pointer;border-radius:2px;font:500 14px var(--sans)}
#player iframe{display:block;width:100%;aspect-ratio:16/9;border:0;background:#000}
.thumb{overflow:hidden;box-shadow:inset 0 0 60px rgba(0,0,0,.45)}.thumb:before,.thumb:after{content:"";position:absolute;left:0;right:0;height:11%;background:#080B16;z-index:1}.thumb:before{top:0}.thumb:after{bottom:0}
.thumb .play{position:relative;z-index:2;background:rgba(8,11,22,.35)}.thumb .num{position:absolute;right:14px;bottom:14%;z-index:2;font:italic 500 28px var(--serif);color:#F1E9D8;opacity:.9}
.card:hover .play{background:#E8A317;border-color:#E8A317}
.thumb .tn{position:absolute;left:16px;bottom:14%;z-index:2;max-width:70%;font:600 clamp(18px,3.4vw,26px)/1.05 var(--serif);color:#F1E9D8;text-shadow:0 2px 12px rgba(0,0,0,.5);padding-bottom:6px}
.thumb .tg{position:absolute;left:16px;top:14%;z-index:2;font:600 11px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:#F6D58A}
.thumb .play{width:44px;height:44px;position:absolute;right:16px;top:50%;margin-top:-22px}
.thumb .num{display:none}
.icons{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0 24px}
.ic{display:flex;flex-direction:column;align-items:center;gap:8px;width:92px;padding:18px 0 12px;border:1px solid var(--line);border-radius:2px;text-decoration:none;color:var(--gold);transition:background .2s,color .2s}
.ic span{font-size:12px;color:var(--mute)}.ic:hover{background:var(--gold);color:#10162A}.ic:hover span{color:#10162A}
.sw{list-style:none;margin:0;padding:0;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.sw li{border:1px solid var(--line);padding:20px;border-radius:2px;display:flex;flex-direction:column;gap:4px}
.sw b{font:italic 500 28px var(--serif);color:var(--gold)}.sw span{font:600 20px var(--serif)}.sw small{color:var(--mute);font-size:13px}
.sw li{flex-direction:row;align-items:center;gap:16px;transition:transform .25s,border-color .25s,box-shadow .25s,background .25s;cursor:default}
.sw li div{display:flex;flex-direction:column;gap:2px}.sw b{font-size:20px}
.lg{width:56px;height:56px;flex:none;transition:transform .3s,filter .3s}
.sw li:hover,.sw li:focus-within{transform:translateY(-6px);border-color:var(--c);box-shadow:0 12px 32px -10px var(--c);background:var(--bg2)}
.sw li:hover .lg{transform:scale(1.12) rotate(-4deg);filter:drop-shadow(0 0 10px var(--c))}
/* shared hover effect for every clickable item */
nav a,.btn,.links a,.ic,.card .thumb,.card .play,.ic svg,#player .bar button{transition:transform .25s,border-color .25s,box-shadow .25s,background .25s,color .25s,filter .3s}
nav a{display:inline-block;padding:4px 2px}
nav a:hover,nav a:focus-visible{transform:translateY(-3px);color:var(--gold)}
.links a{text-decoration:none;padding:10px 18px;border:1px solid var(--line);border-radius:2px}
.btn:hover,.btn:focus-visible,.links a:hover,.links a:focus-visible,.ic:hover,.ic:focus-visible{transform:translateY(-6px);border-color:var(--gold);box-shadow:0 12px 32px -10px var(--gold)}
.links a:hover,.links a:focus-visible{background:var(--bg2);color:var(--gold)}
.ic:hover svg,.ic:focus-visible svg{transform:scale(1.12) rotate(-4deg);filter:drop-shadow(0 0 8px var(--gold))}
.card:hover .thumb,.card:focus-visible .thumb{transform:translateY(-6px);box-shadow:inset 0 0 60px rgba(0,0,0,.45),0 12px 32px -10px var(--gold),0 0 0 1px var(--gold)}
.card:hover .play,.card:focus-visible .play{transform:scale(1.12) rotate(-4deg);filter:drop-shadow(0 0 10px var(--gold))}
#player .bar button:hover,#player .bar button:focus-visible{transform:translateY(-3px);border-color:#E8A317;color:#E8A317;box-shadow:0 8px 20px -8px #E8A317}
/* Liquid Glass theme */
:root{--gb:rgba(255,255,255,.07);--gl:rgba(255,255,255,.2);--gh:rgba(255,255,255,.38);--gs:rgba(0,0,0,.4)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]):not([data-theme="red"]){--gb:rgba(255,255,255,.5);--gl:rgba(27,32,56,.12);--gh:rgba(255,255,255,.95);--gs:rgba(27,32,56,.18)}}
:root[data-theme="light"]{--gb:rgba(255,255,255,.5);--gl:rgba(27,32,56,.12);--gh:rgba(255,255,255,.95);--gs:rgba(27,32,56,.18)}
body::before,#gallery::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;background:radial-gradient(40% 35% at 15% 20%,var(--a1),transparent 70%),radial-gradient(45% 40% at 85% 30%,var(--a2),transparent 70%),radial-gradient(50% 45% at 60% 90%,var(--a3),transparent 70%);animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(-3%,2%,0) scale(1.06)}}
@media (prefers-reduced-motion:reduce){body::before,#gallery::before{animation:none}}
nav,.ic,.links a,.sw li,.portrait,.gbar,.gbtn{background:var(--gb);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--gl);box-shadow:inset 0 1px 0 var(--gh),0 10px 30px -12px var(--gs);border-radius:22px}
nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:20;margin:12px clamp(12px,3vw,40px) 0;padding:12px 24px;border-radius:999px}
.gbtn{color:var(--ink);padding:10px 20px;font:500 14px var(--sans);cursor:pointer;border-radius:999px;transition:transform .25s,border-color .25s,box-shadow .25s,color .25s}
.gbtn:hover,.gbtn:focus-visible{transform:translateY(-4px);border-color:var(--gold);color:var(--gold);box-shadow:0 12px 32px -10px var(--gold)}
.about{background:transparent}
.portrait{border-radius:28px;padding:8px}.portrait img{border-radius:21px}.portrait:after{border-radius:0 0 21px 21px}
.btn{border-radius:999px;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 30px -12px var(--gold);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.thumb{border-radius:20px;border:1px solid var(--gl)}
#film video{border-radius:26px;border:1px solid var(--gl);box-shadow:0 24px 60px -24px var(--gs)}
dialog#player{border-radius:26px;overflow:hidden;border:1px solid var(--gl)}
#player .bar{background:rgba(16,22,42,.72);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
#gallery{position:fixed;inset:0;z-index:40;overflow:auto;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 12px) clamp(12px,3vw,40px) calc(env(safe-area-inset-bottom,0px) + 48px)}
#gallery[hidden]{display:none}
.gbar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px 10px 26px;margin-bottom:36px;border-radius:999px}
.gbar b{font:600 22px var(--serif)}
.gwrap{max-width:1200px;margin:0 auto;padding:0 8px}
.gwrap p{color:var(--mute);margin:-8px 0 28px}
.book .bk-sub{color:var(--mute);margin:-8px 0 24px;max-width:60ch}
.bk{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px;padding:clamp(18px,3vw,32px);background:var(--gb);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--gl);box-shadow:inset 0 1px 0 var(--gh),0 10px 30px -12px var(--gs);border-radius:28px;max-width:860px}
.bk label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)}
.bk .wide{grid-column:1/-1}

.info-r{display:flex;flex-direction:column;gap:2px;width:100%}.info-r b{font:600 16px var(--serif);color:var(--gold)}.info-r p{margin:0;color:var(--ink);font-size:15px;line-height:1.55}
dialog#info{width:min(480px,95vw)}
.faq-ai{max-width:760px;margin-top:18px}.faq-ai label{display:flex;flex-direction:column;gap:8px;color:var(--mute);font-size:14px}
.faq-row{display:flex;gap:8px}.faq-row input{flex:1;min-width:0;font:400 16px var(--sans);color:var(--ink);background:var(--gb);border:1px solid var(--gl);border-radius:999px;padding:12px 16px;color-scheme:light dark}
.faq-row input:focus{outline:2px solid var(--gold);outline-offset:1px}.faq-row .btn{border:0;cursor:pointer;font:600 15px var(--sans)}
.seg{display:flex;gap:6px;justify-content:center}.seg button{font:600 14px var(--sans);color:var(--ink);background:var(--gb);border:1px solid var(--gl);border-radius:999px;padding:8px 18px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--btn-ink);border-color:var(--gold)}
.clk-help{margin:0;text-align:center;font-size:13px;color:var(--mute)}
.wcols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.wcol{display:flex;flex-direction:column;align-items:center;gap:2px}
.wheelbox{position:relative;width:100%}.wheelbox .band{position:absolute;left:0;right:0;top:66px;height:44px;border-radius:14px;border:1px solid var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent);pointer-events:none;z-index:1}
.wheelbox .wheel{cursor:grab;touch-action:pan-y}.wbtn{width:100%;font-size:14px;color:var(--gold);background:var(--gb);border:1px solid var(--gl);border-radius:12px;padding:5px 0;cursor:pointer;transition:background .25s,transform .25s}
.wbtn:hover,.wbtn:active{background:color-mix(in srgb,var(--gold) 22%,transparent);transform:translateY(-1px)}
.clk-type{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)}.clk-type input{font:600 18px var(--sans);text-align:center;color:var(--ink);background:var(--gb);border:1px solid var(--gl);border-radius:14px;padding:11px;color-scheme:light dark}
.clk-type input.bad{border-color:#EF4444;outline:2px solid rgba(239,68,68,.4)}
#clk-svg{touch-action:none;cursor:pointer}.clk-card.drag #clk-svg .hand{transition:none}
.cal-l{flex-wrap:wrap;gap:8px 16px}
/* Premium Dark Red and Dark Black theme */
:root[data-theme="red"]{--bg:#0A0608;--bg2:#190A0F;--ink:#F8EEEE;--mute:#BDA7AB;--gold:#E23B52;--line:rgba(255,200,205,.2);--gb:rgba(255,255,255,.055);--gl:rgba(255,190,198,.2);--gh:rgba(255,200,205,.4);--gs:rgba(0,0,0,.6);--btn-ink:#fff}
:root[data-theme="red"] body{background:radial-gradient(120% 70% at 50% -10%,#3A0A14 0%,#12060A 45%,#050304 100%) fixed}
:root[data-theme="red"] :is(.btn,nav .nav-cta,.chip[aria-pressed="true"],.cd.sel){background:linear-gradient(135deg,#E23B52,#7F0F22);color:#fff;border-color:transparent;box-shadow:0 10px 30px -12px #E23B52}
:root[data-theme="red"] nav .brand .logo,:root[data-theme="red"] .ft-logo{filter:drop-shadow(0 0 10px rgba(226,59,82,.55))}
/* about, map, how it works */
#findme{display:flex;flex-direction:column;gap:18px}
.am-cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.am{padding:14px 16px;border:1px solid var(--gl);border-radius:18px;background:var(--gb);display:flex;flex-direction:column;gap:4px;transition:transform .35s,border-color .35s}.am:hover{transform:translateY(-4px);border-color:var(--gold)}
.am b{font:600 15px var(--serif);color:var(--gold);letter-spacing:.5px}.am span,.am a{font-size:15px;color:var(--ink)}
.am-map{border:1px solid var(--gl);border-radius:22px;overflow:hidden;background:var(--gb);display:flex;flex-direction:column}
.am-map iframe{border:0;width:100%;height:260px;filter:saturate(.9) contrast(1.02)}.am-map .row{padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;font-size:14px;color:var(--mute)}
.am-ask{padding:16px;border:1px solid var(--gl);border-radius:22px;background:var(--gb)}.am-ask b{display:block;font:600 20px var(--serif);margin-bottom:10px}
.hw{margin:0 0 10px;max-width:860px;border:1px solid var(--gl);border-radius:18px;background:var(--gb);overflow:hidden}
.hw summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:14px 16px}.hw summary::-webkit-details-marker{display:none}
